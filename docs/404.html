<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>KarmanLang</title>
<script>
  // GitHub Pages serves this for /KarmanLang/<slug>. Send it to the app with the slug,
  // keeping any sign-in tokens in the query or hash.
  (function () {
    var base = "/KarmanLang/";
    var p = location.pathname;
    var rest = p.indexOf(base) === 0 ? p.slice(base.length) : p.replace(/^\//, "");
    var slug = rest.split("/")[0];
    if (/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(slug)) {
      var q = location.search ? "&" + location.search.slice(1) : "";
      location.replace(base + "?a=" + slug + q + location.hash);
    } else {
      document.addEventListener("DOMContentLoaded", function () { document.body.textContent = "Page not found."; });
    }
  })();
</script>
</head>
<body></body>
</html>
