<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KarmanLang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="assets/kl.css">
</head>
<body>
<header class="topbar">
  <a class="brand" id="brand" href="./"><b>KarmanLang</b><span id="brand-sub"></span></a>
  <div class="who" id="who" hidden><span id="who-email"></span><a id="who-admin" href="admin" hidden>Admin</a><button class="btn ghost" id="btn-signout">Sign out</button></div>
</header>

<main class="main narrow" id="main">
  <div class="notice" id="notice" role="note" hidden></div>

  <!-- sign in -->
  <section class="card signin" id="signin" hidden aria-labelledby="signin-h">
    <div>
      <h1 id="signin-h">Sign in</h1>
      <p class="muted" id="signin-sub" style="margin:6px 0 0">Use the email address you were approved with.</p>
    </div>
    <div id="provider-btns" style="display:flex;flex-direction:column;gap:8px"></div>
    <div class="divider" id="or" hidden>or</div>
    <form id="email-form" novalidate style="display:flex;flex-direction:column;gap:10px">
      <label class="f" for="email">Email address<input type="email" id="email" autocomplete="email" required placeholder="you@school.org"></label>
      <button class="btn primary block" id="email-btn" type="submit">Email me a sign-in link</button>
    </form>
    <p class="status" id="signin-status" role="status"></p>
  </section>

  <!-- agent list (no slug) -->
  <section class="card" id="home" hidden>
    <h1>Your agents</h1>
    <div id="home-list"></div>
  </section>

  <!-- not allowed -->
  <section class="card" id="denied" hidden>
    <h2>You don't have access yet</h2>
    <p class="muted" id="denied-msg"></p>
    <div class="row"><button class="btn" id="btn-switch">Use a different account</button></div>
  </section>

  <!-- chat -->
  <section class="chat" id="chat" hidden aria-labelledby="agent-name">
    <div class="chat-head">
      <div style="min-width:0"><h2 id="agent-name"></h2><div class="small muted" id="agent-desc"></div></div>
      <span class="spacer"></span>
      <span class="small muted" id="left"></span>
      <button class="btn" id="btn-new">New conversation</button>
    </div>
    <div class="log" id="log" aria-live="polite"></div>
    <form class="compose" id="compose">
      <label class="eyebrow" for="input">Message</label>
      <textarea id="input" maxlength="8000" rows="3" placeholder="Type a message. Ctrl/⌘ + Enter to send."></textarea>
      <div class="row"><span class="status" id="status" role="status"></span><span class="spacer"></span><button class="btn primary" id="btn-send" type="submit">Send</button></div>
    </form>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="assets/config.js"></script>
<script src="assets/core.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
